<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Dark Light</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230d0f12%22/%3E%3Cpath d=%22M12 26h8l-1-12h-6z%22 fill=%22%238a877f%22/%3E%3Ccircle cx=%2216%22 cy=%2210%22 r=%225%22 fill=%22%23f2b34b%22/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0d0f12; --panel: #14171c; --line: #252a32;
    --ink: #d9d4c7; --dim: #8a877f; --lamp: #f2b34b; --you: #9cc3e6; --bad: #e07a6a; --good: #7bc47f;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  .app { height: 100%; max-width: 1060px; margin: 0 auto; padding: 0 16px; display: grid;
         grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto auto;
         grid-template-areas: "header" "log" "status" "form"; }
  @media (min-width: 940px) {
    .app { grid-template-columns: minmax(0, 1fr) 260px; column-gap: 28px;
           grid-template-areas: "header header" "log side" "status side" "form side"; }
  }
  header { grid-area: header; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 20px 0 12px; border-bottom: 1px solid var(--line); }
  h1 { font: 600 1.35rem/1.2 var(--serif); margin: 0; letter-spacing: .02em; white-space: nowrap; }
  h1 span { color: var(--lamp); }
  .meta { font: .75rem var(--mono); color: var(--dim); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--dim); margin-right: 6px; }
  .dot.ready { background: var(--good); } .dot.offline { background: var(--bad); }
  button, label { font: .75rem var(--mono); color: var(--dim); background: none; border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; cursor: pointer; }
  button:hover, label:hover { color: var(--ink); border-color: var(--dim); }
  label input { vertical-align: -2px; margin: 0 4px 0 0; }
  #mapToggle { display: inline-block; }
  @media (min-width: 940px) { #mapToggle { display: none; } }

  #log { grid-area: log; overflow-y: auto; padding: 20px 0; scroll-behavior: smooth; }
  .entry { margin: 0 0 18px; animation: in .35s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } }
  .you { font: .9rem var(--mono); color: var(--you); margin-bottom: 6px; }
  .you::before { content: "> "; color: var(--dim); }
  .story { font: 1.12rem/1.65 var(--serif); margin: 0; }
  .story.plain { color: #c9c4b6; }
  .story.intro { font-style: italic; color: var(--dim); margin-bottom: 12px; }
  .beat { font: italic 1rem/1.55 var(--serif); color: #c7a56b; margin: 8px 0 0; padding-left: 12px; border-left: 2px solid #5b4a2c; }
  .hint { font: italic .95rem/1.5 var(--serif); color: var(--lamp); margin: 8px 0 0; opacity: .85; }
  .hint::before { content: "A thought: "; font-style: normal; }
  .facts { display: none; font: .72rem/1.5 var(--mono); color: var(--dim); margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--line); white-space: pre-wrap; }
  body.show-facts .facts { display: block; }
  .thinking { font: italic 1rem var(--serif); color: var(--dim); }
  .thinking::after { content: "…"; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .ending { margin: 14px 0 6px; padding: 18px 20px; border: 1px solid var(--line); border-top: 3px solid var(--tone, var(--lamp)); border-radius: 6px; background: var(--panel); }
  .ending .kicker { font: .7rem var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .ending h2 { font: 600 1.4rem/1.3 var(--serif); margin: 4px 0 10px; color: var(--tone, var(--lamp)); }
  .ending p { font: 1.05rem/1.6 var(--serif); margin: 0 0 14px; }
  .ending button { color: var(--bg); background: var(--tone, var(--lamp)); border-color: transparent; font-size: .85rem; padding: 6px 12px; }
  .tone-best { --tone: #f2b34b; } .tone-bittersweet { --tone: #b9a3d9; } .tone-mixed { --tone: #8fb8c9; }
  .tone-dark { --tone: #8a877f; } .tone-worst { --tone: #e07a6a; } .tone-good { --tone: #7bc47f; }

  #status { grid-area: status; font: .78rem/1.6 var(--mono); color: var(--dim); border-top: 1px solid var(--line); padding: 10px 0; display: flex; flex-wrap: wrap; gap: 4px 18px; }
  #status b { color: var(--ink); font-weight: 600; }
  form { grid-area: form; display: flex; gap: 8px; padding: 0 0 20px; }
  #cmd { flex: 1; min-width: 0; font: 1rem var(--mono); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; outline: none; }
  #cmd:focus { border-color: var(--lamp); }
  #go { font-size: .9rem; padding: 0 16px; color: var(--bg); background: var(--lamp); border-color: var(--lamp); }
  #go:hover { color: var(--bg); filter: brightness(1.1); }
  #go:disabled { opacity: .5; cursor: wait; }

  aside { grid-area: side; padding: 20px 0; display: none; flex-direction: column; gap: 22px; }
  body.map-open aside { display: flex; grid-area: log; overflow-y: auto; }
  body.map-open #log { display: none; }
  @media (min-width: 940px) { aside, body.map-open aside { display: flex; grid-area: side; } body.map-open #log { display: block; } }
  aside h3 { font: .7rem var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin: 0 0 8px; font-weight: 500; }
  #map svg { width: 100%; height: auto; display: block; }
  .room rect { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
  .room.visited rect { fill: #1b2028; stroke: #3a414c; }
  .room.here rect { stroke: var(--lamp); stroke-width: 2; }
  .room text { font: 8.5px var(--mono); fill: var(--dim); text-anchor: middle; }
  .room.visited text { fill: var(--ink); }
  .room.here text { fill: var(--lamp); }
  .link { stroke: #3a414c; stroke-width: 2; }
  .link.locked { stroke-dasharray: 3 3; stroke: var(--bad); opacity: .7; }
  .legend { font: .68rem var(--mono); color: var(--dim); margin-top: 6px; }
  .clock { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .clock div { height: 100%; width: 0; background: linear-gradient(90deg, var(--lamp), var(--bad)); transition: width .4s; }
  .clock-label { font: .72rem var(--mono); color: var(--dim); margin-top: 6px; }
  #endings ul { list-style: none; margin: 0; padding: 0; font: .82rem/1.8 var(--serif); }
  #endings li { display: flex; align-items: baseline; gap: 8px; }
  #endings li::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--tone, var(--dim)); transform: translateY(-1px); }
  #endings li.missing { display: block; color: var(--dim); font: .75rem/1.5 var(--mono); margin-bottom: 6px; }
  #endings li.missing::before { display: none; }
  #endings li.missing small { display: block; font: italic .8rem/1.4 var(--serif); opacity: .8; }
  select { font: .75rem var(--mono); color: var(--dim); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }
  select:hover { color: var(--ink); border-color: var(--dim); }
  .opts { display: grid; gap: 8px; font: .75rem var(--mono); color: var(--dim); }
  .opts input[type=text] { font: .8rem var(--mono); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; width: 100%; }
  .opts .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .opts .note { font-size: .7rem; opacity: .8; }
  #board ol { margin: 0; padding-left: 18px; font: .8rem/1.7 var(--serif); }
  #board .tabs { display: flex; gap: 4px; margin-bottom: 6px; }
  #board .tabs button.on { color: var(--ink); border-color: var(--dim); }
  #partyPanel .code { font: 600 1.6rem var(--mono); letter-spacing: .2em; color: var(--lamp); }
  #partyPanel ul { list-style: none; margin: 6px 0 0; padding: 0; font: .82rem/1.6 var(--serif); }
  #partyPanel li b { font-family: var(--mono); color: var(--lamp); margin-right: 6px; }
  .by { font: .7rem var(--mono); color: var(--dim); }
  .resumed { font: italic .9rem var(--serif); color: var(--dim); margin: 0 0 18px; }
</style>
</head>
<body>
<div class="app">
<header>
  <h1 id="title">The Dark <span>Light</span></h1>
  <div class="meta">
    <span id="llm"><span class="dot"></span>narrator: checking</span>
    <label><input type="checkbox" id="showFacts">engine facts</label>
    <select id="world" aria-label="Adventure" hidden></select>
    <button id="mapToggle" type="button">map</button>
    <button id="undo" type="button" title="Take back your last move">undo</button>
    <button id="restart" type="button">new game</button>
  </div>
</header>
<main id="log" aria-live="polite"></main>
<aside>
  <section id="map"><h3>Map</h3><div id="mapSvg"></div>
    <div class="legend">dashed red = locked</div></section>
  <section><h3 id="clockTitle">The ship</h3><div class="clock"><div id="clockBar"></div></div><div class="clock-label" id="clockLabel"></div></section>
  <section id="endings"><h3 id="endingsTitle">Endings found</h3><ul id="endingList"></ul></section>
  <section id="partyPanel" hidden><h3>Party</h3>
    <div class="code" id="partyCode"></div>
    <div class="opts"><span>On a phone on this Wi-Fi, open <b id="partyUrl"></b> and enter the code.</span>
      <span id="partyRound"></span></div>
    <ul id="partyProposals"></ul></section>
  <section id="board"><h3>Leaderboard</h3>
    <div class="tabs"><button type="button" data-mode="relaxed">relaxed</button><button type="button" data-mode="normal" class="on">normal</button><button type="button" data-mode="hard">hard</button></div>
    <ol id="boardList"></ol><div class="opts note" id="boardNote"></div></section>
  <section><h3>Options</h3><div class="opts">
    <label class="row" style="border:0;padding:0">Name <input type="text" id="playerName" maxlength="20" placeholder="for the leaderboard"></label>
    <div class="row">Difficulty <select id="mode"></select></div>
    <div class="row"><label><input type="checkbox" id="speak">read aloud</label><label><input type="checkbox" id="ambience">sound</label></div>
    <div class="row"><button type="button" id="saveCode">get save code</button><button type="button" id="loadCode">load code</button></div>
    <div class="note" id="codeNote"></div>
    <div class="row"><button type="button" id="partyStart">start party mode</button></div>
  </div></section>
</aside>
<div id="status"></div>
<form id="f" autocomplete="off">
  <input id="cmd" placeholder="What do you do?" aria-label="Command" autofocus>
  <button id="go">Go</button>
</form>
</div>
<script>
const $ = s => document.querySelector(s);
const log = $("#log");
const MAX_LOG = 80;   // entries kept in the saved transcript
let session = null, history = [], hIdx = 0, WORLD = null, INFO = null, busy = false, MODE = "normal";
let party = null, partySince = 0, partyTimer = null, boardMode = "normal";

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
// Browser storage is a per-viewer convenience: every access may throw (private mode, blocked storage).
function load(key, dflt) { try { const v = localStorage.getItem(key); return v === null ? dflt : JSON.parse(v); } catch { return dflt; } }
function store(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }
function drop(key) { try { localStorage.removeItem(key); } catch {} }
const endKey = () => `${WORLD}-endings`, saveKey = () => `${WORLD}-save`;
function found() { return load(endKey(), {}) || {}; }
function remember(e) { const f = found(); f[e.id] = e.title; store(endKey(), f); }

function addEntry(you) {
  const el = document.createElement("div");
  el.className = "entry";
  el.innerHTML = (you ? `<div class="you">${esc(you)}</div>` : "") + `<p class="story thinking">the narrator considers</p>`;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function fill(el, d) {
  const p = el.querySelector(".story");
  p.className = "story" + (d.narrated ? "" : " plain");
  p.textContent = d.text || "";
  if (!d.text) p.remove();
  let html = "";
  if (d.intro) el.insertAdjacentHTML("afterbegin", `<p class="story intro">${esc(d.intro)}</p>`);
  (d.beats || []).forEach(b => html += `<p class="beat">${esc(b)}</p>`);
  if (d.director) html += `<p class="hint">${esc(d.director)}</p>`;
  const e = d.status && d.status.ending;
  if (e && d.ending_text) {
    remember(e);
    const n = Object.keys(found()).length;
    html += `<div class="ending tone-${esc(e.tone)}"><div class="kicker">Ending · ${n} of ${INFO.endings_total} found</div>
      <h2>${esc(e.title)}</h2><p>${esc(d.ending_text)}</p><button type="button" class="again">Play again</button></div>`;
  }
  const meta = [];
  if (d.model_raw) meta.push(`model said: ${JSON.stringify(d.model_raw)}`);
  if (d.command) meta.push(`parsed by ${d.parsed_by}: ${JSON.stringify(d.command)}`);
  if (d.facts && d.facts.length) meta.push(d.facts.map(f => "• " + f).join("\n"));
  meta.push(d.narrated ? "narrated by model" : "plain engine text");
  html += `<div class="facts">${esc(meta.join("\n"))}</div>`;
  el.insertAdjacentHTML("beforeend", html);
  log.scrollTop = log.scrollHeight;
  if (d.status) render(d.status);
  if (d.save) keep(d.save);
  say([d.text, ...(d.beats || []), d.director, d.ending_text]);
  if (e && d.ending_text) drawBoard();
}

// ---- read aloud (the browser's own voices, so it works offline) ----
function say(parts) {
  if (!$("#speak").checked || !("speechSynthesis" in window)) return;
  const text = parts.filter(Boolean).join(" ");
  if (!text) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.95; speechSynthesis.speak(u); } catch {}
}

// ---- ambient sound: generated noise, no audio files ----
let audio = null;
function startAmbience(kind) {
  stopAmbience();
  if (!kind || kind === "none") return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const len = ctx.sampleRate * 4, buf = ctx.createBuffer(1, len, ctx.sampleRate), data = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; data[i] = last * 3.5; }  // brown noise
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const filter = ctx.createBiquadFilter(); filter.type = "lowpass"; filter.frequency.value = kind === "wind" ? 500 : 900;
    const gain = ctx.createGain(); gain.gain.value = 0.25;
    const lfo = ctx.createOscillator(), depth = ctx.createGain();   // slow swells, like gusts or waves
    lfo.frequency.value = kind === "wind" ? 0.13 : 0.08; depth.gain.value = 0.15;
    lfo.connect(depth).connect(gain.gain);
    src.connect(filter).connect(gain).connect(ctx.destination);
    src.start(); lfo.start();
    audio = { ctx };
    if (kind === "storm") rumble(ctx);
  } catch { audio = null; }
}
function rumble(ctx) {   // distant thunder now and then
  const t = setTimeout(() => {
    if (!audio || audio.ctx !== ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sawtooth"; o.frequency.value = 38 + Math.random() * 20;
    const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 120;
    g.gain.setValueAtTime(0, ctx.currentTime); g.gain.linearRampToValueAtTime(0.35, ctx.currentTime + 0.4);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 3.5);
    o.connect(f).connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 3.6);
    rumble(ctx);
  }, 12000 + Math.random() * 25000);
  audio && (audio.timer = t);
}
function stopAmbience() { if (audio) { clearTimeout(audio.timer); try { audio.ctx.close(); } catch {} audio = null; } }

// ---- leaderboard ----
async function drawBoard() {
  if (!WORLD) return;
  try {
    const d = await (await fetch(`api/leaderboard?world=${encodeURIComponent(WORLD)}`)).json();
    const rows = (d.fastest && d.fastest[boardMode]) || [];
    $("#boardList").innerHTML = rows.length ? rows.map(r => `<li>${esc(r.name)} <span class="by">${r.turns} turns</span></li>`).join("")
      : `<li class="by" style="list-style:none;margin-left:-18px">No one has reached the best ending on ${esc(boardMode)} yet.</li>`;
    const c = (d.collectors || []).slice(0, 3).map(r => `${esc(r.name)} (${r.endings})`).join(", ");
    $("#boardNote").innerHTML = (c ? `Most endings: ${c}. ` : "") + ($("#playerName").value ? "" : "Set a name to appear here.")
      + (d.persistent ? "" : " Scores reset when the app restarts.");
  } catch {}
}

// Save the game state and transcript, so a reload or a server restart doesn't lose the night.
function keep(save) {
  while (log.children.length > MAX_LOG) log.firstElementChild.remove();
  store(saveKey(), { save, log: log.innerHTML });
}

function setInfo(d) {
  INFO = d; WORLD = d.world;
  const accent = d.theme && d.theme.accent;
  document.documentElement.style.setProperty("--lamp", accent || "#f2b34b");
  if (d.modes) $("#mode").innerHTML = d.modes.map(m => `<option value="${esc(m.id)}" title="${esc(m.label)}">${esc(m.id)}</option>`).join("");
  if (d.status && d.status.mode) { MODE = d.status.mode; $("#mode").value = MODE; }
  if ($("#ambience").checked) startAmbience(d.ui && d.ui.ambience);
  drawBoard();
  const words = d.title.split(" "), last = words.pop();
  $("#title").innerHTML = `${esc(words.join(" "))} <span>${esc(last)}</span>`;
  document.title = d.title;
  $("#clockTitle").textContent = (d.ui && d.ui.clock_title) || "Time";
  $("#world").value = WORLD;
}

function render(s) {
  $("#status").innerHTML = [
    `<span><b>${esc(s.room)}</b></span>`,
    `<span>exits: ${s.exits.join(", ")}</span>`,
    s.items.length ? `<span>here: ${esc(s.items.join(", "))}</span>` : "",
    `<span>carrying: ${s.inventory.length ? esc(s.inventory.join(", ")) : "nothing"}</span>`,
    `<span>turn ${s.turns}</span>`,
  ].join("");
  const ui = (INFO && INFO.ui) || {};
  const pct = s.deadline ? Math.min(100, Math.round(100 * s.turns / s.deadline)) : 0;
  $("#clockBar").style.width = pct + "%";
  const left = Math.max(0, (s.deadline || 0) - s.turns);
  const labels = ui.clock_labels || [[0, ""]];
  $("#clockLabel").textContent = s.over ? (ui.over_label || "The story is over.")
    : (labels.find(([min]) => left > min) || labels[labels.length - 1])[1];
  drawMap(s);
  drawEndings();
  $("#cmd").disabled = s.over; $("#go").disabled = s.over;
  $("#cmd").placeholder = s.over ? "The story is over. Play again, or undo." : "What do you do?";
}

function drawMap(s) {
  if (!INFO) return;
  const MAP = INFO.map;
  const W = 76, H = 42, GX = 18, GY = 22, P = 4;
  const cx = n => P + n.x * (W + GX) + W / 2, cy = n => P + n.y * (H + GY) + H / 2;
  const by = Object.fromEntries(MAP.nodes.map(n => [n.id, n]));
  const cols = Math.max(...MAP.nodes.map(n => n.x)) + 1, rows = Math.max(...MAP.nodes.map(n => n.y)) + 1;
  const vw = cols * W + (cols - 1) * GX + 2 * P, vh = rows * H + (rows - 1) * GY + 2 * P;
  const visited = new Set(s.visited), flags = new Set(s.flags);
  let svg = `<svg viewBox="0 0 ${vw} ${vh}" role="img" aria-label="${esc((INFO.ui && INFO.ui.map_label) || "Map")}">`;
  for (const e of MAP.edges) {
    const a = by[e.a], b = by[e.b];
    const locked = e.lock && !flags.has(e.lock);
    svg += `<line class="link${locked ? " locked" : ""}" x1="${cx(a)}" y1="${cy(a)}" x2="${cx(b)}" y2="${cy(b)}"/>`;
  }
  for (const n of MAP.nodes) {
    const cls = ["room", visited.has(n.id) ? "visited" : "", n.id === s.room_id ? "here" : ""].join(" ");
    const words = n.name.split(" "), mid = Math.ceil(words.length / 2);
    const lines = words.length > 1 && n.name.length > 12 ? [words.slice(0, mid).join(" "), words.slice(mid).join(" ")] : [n.name];
    const x = cx(n) - W / 2, y = cy(n) - H / 2;
    svg += `<g class="${cls}"><rect x="${x}" y="${y}" width="${W}" height="${H}" rx="6"/>`;
    lines.forEach((t, i) => svg += `<text x="${cx(n)}" y="${cy(n) + 3 + (i - (lines.length - 1) / 2) * 11}">${esc(t)}</text>`);
    svg += `</g>`;
  }
  $("#mapSvg").innerHTML = svg + "</svg>";
}

// Found endings by title; missing ones show a hint so there's always something to aim for.
function drawEndings() {
  if (!INFO) return;
  const f = found();
  const got = INFO.endings.filter(e => f[e.id]), missing = INFO.endings.filter(e => !f[e.id]);
  $("#endingsTitle").textContent = `Endings found · ${got.length} of ${INFO.endings_total}`;
  $("#endingList").innerHTML =
    got.map(e => `<li class="tone-${esc(e.tone)}">${esc(e.title)}</li>`).join("") +
    missing.map(e => `<li class="missing">? ? ?${e.hint ? `<small>${esc(e.hint)}</small>` : ""}</li>`).join("");
}

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  if (!r.ok) {
    const err = new Error((await r.json().catch(() => ({}))).detail || r.statusText);
    err.status = r.status;
    throw err;
  }
  return r.json();
}

async function newGame() {
  log.innerHTML = "";
  if (WORLD) drop(saveKey());
  const el = addEntry(null);
  try {
    const d = await post("api/new", { world: WORLD, mode: MODE, name: $("#playerName").value || null });
    session = d.session; setInfo(d);
    fill(el, d);
  } catch (e) { fill(el, { text: "Could not start the game: " + e.message }); }
  $("#cmd").focus();
}

// Ask the server for a fresh session built from the browser's save. Returns false if there's none.
async function resume(showNote) {
  const kept = load(saveKey(), null);
  if (!kept || !kept.save || kept.save.ending) return false;
  try {
    const d = await post("api/resume", { save: kept.save, name: $("#playerName").value || null });
    session = d.session; setInfo(d);
    if (showNote) {
      log.innerHTML = kept.log || "";
      log.insertAdjacentHTML("beforeend", `<p class="resumed">You pick up where you left off.</p>`);
      log.scrollTop = log.scrollHeight;
    }
    render(d.status);
    return true;
  } catch { drop(saveKey()); return false; }
}

async function send(text, url = "api/turn") {
  if (busy || !session) return;
  busy = true; $("#go").disabled = true;
  const el = addEntry(text);
  const body = url === "api/turn" ? { session, input: text } : { session };
  try { fill(el, await post(url, body)); }
  catch (err) {
    if (err.status === 404 && await resume(false)) {   // server restarted: rebuild the game and retry once
      body.session = session;
      try { fill(el, await post(url, body)); } catch (e2) { fill(el, { text: e2.message }); }
    } else fill(el, { text: err.message });
  }
  busy = false;
  if (!$("#cmd").disabled) { $("#go").disabled = false; $("#cmd").focus(); }
}

$("#f").addEventListener("submit", e => {
  e.preventDefault();
  const text = $("#cmd").value.trim();
  if (!text) return;
  history.push(text); hIdx = history.length;
  $("#cmd").value = "";
  send(text);
});

$("#cmd").addEventListener("keydown", e => {
  if (e.key === "ArrowUp" && hIdx > 0) { $("#cmd").value = history[--hIdx]; e.preventDefault(); }
  if (e.key === "ArrowDown") { hIdx = Math.min(history.length, hIdx + 1); $("#cmd").value = history[hIdx] || ""; e.preventDefault(); }
});
log.addEventListener("click", e => { if (e.target.closest(".again")) newGame(); });  // also works on restored transcripts
$("#restart").addEventListener("click", newGame);
$("#undo").addEventListener("click", () => send("undo", "api/undo"));
$("#mapToggle").addEventListener("click", () => document.body.classList.toggle("map-open"));
$("#showFacts").addEventListener("change", e => document.body.classList.toggle("show-facts", e.target.checked));
$("#world").addEventListener("change", async e => {
  WORLD = e.target.value; store("adventure", WORLD);
  log.innerHTML = "";
  if (!await resume(true)) newGame();
});

$("#mode").addEventListener("change", e => { MODE = e.target.value; store("mode", MODE); newGame(); });
$("#playerName").addEventListener("change", async e => {
  store("name", e.target.value);
  if (session) try { await post("api/name", { session, name: e.target.value }); } catch {}
  drawBoard();
});
$("#speak").addEventListener("change", e => { store("speak", e.target.checked); if (!e.target.checked && "speechSynthesis" in window) speechSynthesis.cancel(); });
$("#ambience").addEventListener("change", e => { store("ambience", e.target.checked); e.target.checked ? startAmbience(INFO && INFO.ui && INFO.ui.ambience) : stopAmbience(); });
document.querySelectorAll("#board .tabs button").forEach(b => b.addEventListener("click", () => {
  boardMode = b.dataset.mode;
  document.querySelectorAll("#board .tabs button").forEach(x => x.classList.toggle("on", x === b));
  drawBoard();
}));
$("#saveCode").addEventListener("click", async () => {
  if (!session) return;
  try {
    const d = await post("api/savecode", { session });
    $("#codeNote").textContent = `Your code: ${d.code}. Load it on any device on this box` + (d.persistent ? " (it lasts 30 days)." : " until the app restarts.");
  } catch (e) { $("#codeNote").textContent = e.message; }
});
$("#loadCode").addEventListener("click", async () => {
  const code = (prompt("Save code:") || "").trim();
  if (!code) return;
  try {
    const r = await fetch(`api/savecode/${encodeURIComponent(code)}?name=${encodeURIComponent($("#playerName").value || "")}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.statusText);
    WORLD = d.world; store("adventure", WORLD); $("#world").value = WORLD;
    session = d.session; setInfo(d);
    log.innerHTML = "";
    const el = addEntry(null);
    fill(el, { ...d, text: "You pick up a saved game. " + d.text });
    $("#codeNote").textContent = "";
  } catch (e) { $("#codeNote").textContent = e.message; }
});

// ---- party mode (host side): show the code, the ideas coming in, and play the winners here ----
$("#partyStart").addEventListener("click", async () => {
  if (!session) return;
  if (party) { stopParty(); return; }
  try {
    const d = await post("api/party", { session });
    party = d.code; partySince = 0;
    $("#partyPanel").hidden = false;
    $("#partyCode").textContent = party;
    $("#partyUrl").textContent = new URL("party", location.href).href;
    $("#partyStart").textContent = "end party mode";
    pollParty();
  } catch (e) { $("#codeNote").textContent = e.message; }
});
function stopParty() {
  party = null; clearTimeout(partyTimer);
  $("#partyPanel").hidden = true; $("#partyStart").textContent = "start party mode";
}
async function pollParty() {
  if (!party) return;
  try {
    const r = await fetch(`api/party/${party}?since=${partySince}`);
    if (!r.ok) { stopParty(); return; }
    const d = await r.json();
    for (const entry of d.log) {
      partySince = entry.n;
      const el = addEntry(`${entry.said}`);
      el.querySelector(".you").insertAdjacentHTML("beforeend", ` <span class="by">(${esc(entry.by)})</span>`);
      fill(el, { text: entry.text, beats: entry.beats, ending_text: entry.ending, status: entry.status, narrated: true });
    }
    $("#partyRound").textContent = `${d.players} player${d.players === 1 ? "" : "s"}` +
      (d.ends_in != null ? ` · round ${d.round} ends in ${Math.ceil(d.ends_in)}s` : " · waiting for ideas");
    $("#partyProposals").innerHTML = d.proposals.map(p => `<li><b>${p.votes}</b>${esc(p.text)} <span class="by">${esc(p.by)}</span></li>`).join("");
  } catch {}
  partyTimer = setTimeout(pollParty, 1500);
}

async function checkLLM() {
  try {
    const d = await (await fetch("api/health")).json();
    $("#llm").innerHTML = `<span class="dot ${d.llm}"></span>narrator: ${d.llm === "ready" ? esc(d.model.split("/").pop()) : d.llm === "none" ? "plain text" : "offline (plain text)"}`;
    if (d.llm === "offline") setTimeout(checkLLM, 5000);
  } catch { setTimeout(checkLLM, 5000); }
}

async function start() {
  $("#playerName").value = load("name", "") || "";
  MODE = load("mode", "normal") || "normal";
  $("#speak").checked = !!load("speak", false);
  $("#ambience").checked = !!load("ambience", false);
  try {
    const d = await (await fetch("api/worlds")).json();
    const ids = d.worlds.map(w => w.id), saved = load("adventure", null);
    WORLD = ids.includes(saved) ? saved : d.default;
    $("#world").innerHTML = d.worlds.map(w => `<option value="${esc(w.id)}" title="${esc(w.blurb)}">${esc(w.title)}</option>`).join("");
    $("#world").value = WORLD;
    $("#world").hidden = d.worlds.length < 2;
  } catch {}
  if (!await resume(true)) newGame();
}
checkLLM();
start();
</script>
</body>
</html>
